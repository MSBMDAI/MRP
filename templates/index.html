<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SupplyFlow — MRP Planning Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; background: #fff59d; color: #1e293b; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #root { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff59d; }
    .header { background: #fff; border-bottom: 1px solid #e0e3ea; padding: 7px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .summary { background: #fff; border-bottom: 1px solid #e0e3ea; padding: 5px 16px; display: flex; gap: 6px; flex-shrink: 0; }
    .summary-cell { border-radius: 5px; padding: 5px 10px; flex: 1; min-width: 0; }
    .summary-cell .label { font-size: 8px; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
    .summary-cell .value { font-size: 14px; font-weight: 700; margin-top: 1px; }
    .toolbar { background: #fff; border-bottom: 1px solid #e0e3ea; padding: 5px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .main { flex: 1; display: flex; overflow: hidden; background: #fff59d; }
    .grid-wrap { flex: 1; overflow: auto; background: #fff59d; }
    table { border-collapse: collapse; font-size: 11px; min-width: 1100px; }
    th { padding: 5px; text-align: left; font-size: 9px; font-weight: 600; color: #475569; border-bottom: 2px solid #d1d5db; white-space: nowrap; background: #f0f1f5; }
    th.sticky-left { position: sticky; left: 0; z-index: 60; background: #f0f1f5; }
    td { padding: 2px 5px; font-size: 10px; font-family: 'Source Code Pro', monospace; }
    td.sticky-left { position: sticky; z-index: 10; white-space: nowrap; background: inherit; }
    .footer { background: #fff; border-top: 1px solid #e0e3ea; padding: 4px 16px; display: flex; justify-content: space-between; font-size: 9px; color: #94a3b8; flex-shrink: 0; }
    .pill { background: #f0f2f7; border-radius: 5px; padding: 4px 10px; font-size: 10px; color: #64748b; border: 1px solid #e0e3ea; }
    input[type="text"], input[type="number"] { outline: none; font-family: inherit; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"] { -moz-appearance: textfield; }
    .copilot-panel { width: 320px; min-width: 320px; border-left: 1px solid #e0e3ea; background: #fff59d; display: flex; flex-direction: column; flex-shrink: 0; }
    .chat-msg { max-width: 92%;; padding: 8px 10px; border-radius: 10px; font-size: 10px; line-height: 1.5; white-space: pre-wrap; }
    .chat-msg.user { align-self: flex-end; border-radius: 10px 10px 2px 10px; background: #eef2ff; border: 1px solid rgba(79,70,229,0.13); }
    .chat-msg.ai { align-self: flex-start; border-radius: 10px 10px 10px 2px; background: #fff; border: 1px solid #e0e3ea; }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #fff59d; }
    ::-webkit-scrollbar-thumb { background: #e0e3ea; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    window.MRP_CONFIG = {
      weekLabels: {{ week_labels | tojson }},
      rowTypes: {{ row_types | tojson }},
      vendors: {{ vendors | tojson }},
      noteTags: {{ note_tags | tojson }},
      rawSkus: {{ raw_skus | tojson }},
    };
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
